    <ellipse cx="1040" cy="170" rx="125" ry="45"/>
    <path d="M915 170h250M1040 45v250"/>
  </g>
  <rect x="52" y="51" width="216" height="29" rx="14.5" fill="#173c43" stroke="#327278"/>
