<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">AION 2 Global Translator</title>
  <desc id="desc">Native game text, a language you choose. An independent Windows localization tool.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c31"/>
      <stop offset="1" stop-color="#08111e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62e4dc"/>
      <stop offset="1" stop-color="#8bbaff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#256f80" stop-opacity=".28"/>
      <stop offset="1" stop-color="#256f80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="#26384e"/>
  <ellipse cx="1045" cy="160" rx="290" ry="230" fill="url(#glow)"/>
