  <text x="50" y="145" fill="#f1f6ff" font-family="Segoe UI, Arial, sans-serif" font-size="57" font-weight="700" letter-spacing="-.8">AION 2</text>
  <text x="50" y="206" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="49" font-weight="600" letter-spacing="-1.1">Global Translator</text>
  <text x="53" y="248" fill="#b2c3d9" font-family="Segoe UI, Arial, sans-serif" font-size="19">Native text. A language you choose.</text>
  <text x="53" y="312" fill="#7c91ac" font-family="Segoe UI, Arial, sans-serif" font-size="13">Local source files</text>
